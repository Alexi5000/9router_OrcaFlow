name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start OrcaFlow with `npm run dev`
        2. Navigate to dashboard
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of OrcaFlow is affected?
      options:
        - Dashboard UI
        - API Routing
        - Provider Integration
        - OAuth / Authentication
        - Format Translation
        - Usage Analytics
        - MITM Proxy
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OrcaFlow Version
      description: Run `npm pkg get version` in the project root
      placeholder: "0.3.35"

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node -v`
      placeholder: "v20.x.x"

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output (errors, stack traces).
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or info.
